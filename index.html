<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonGotchi - Clean Architecture</title>
    <!-- Los estilos están en la raíz -->
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" type="text/css" href="pantallaInicial.css">
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="pantalla-inicial" class="pantalla-superpuesta" style="display: none;">
        <div class="contenedor-inicial">
            <h2 id="mensaje-bienvenida">¡Bienvenido!</h2>
            <div id="formulario-nombre" style="display: none;">
                <label for="nombre-tamagotchi">Ingrese el nombre de su Tamagotchi:</label>
                <input type="text" id="nombre-tamagotchi" placeholder="Nombre">
                <button id="crear-tamagotchi">Adoptar</button>
            </div>
            <button id="continuar-juego" style="display: none;">Continuar</button>
        </div>
    </div>

    <div id="pantalla-muerte" class="pantalla-superpuesta" style="display: none;">
        <div class="contenedor-inicial">
            <h1 id="mensaje-muerte" style="display: none;"></h1>
            <button id="reiniciar-Tamagotchi" style="display: none;">Reiniciar</button>
        </div>
    </div>

    <div class="contenedor-principal">
        <div class="contenedor-contenido">
            <div class="lado-izquierdo">
                <div id="nombre-dragon">Nombre del Dragón</div>
                <div id="minijuego-container" style="display: none;">
                    <iframe id="gameFrame" src="" width="500" height="500"></iframe>
                </div>
                <div class="barras-estado">
                    <div class="estado">
                        <label for="barra-hambre">Hambre</label>
                        <div class="contenedor-barra"><div id="barra-hambre" class="barra"></div></div>
                    </div>
                    <div class="estado">
                        <label for="barra-felicidad">Felicidad</label>
                        <div class="contenedor-barra"><div id="barra-felicidad" class="barra"></div></div>
                    </div>
                    <div class="estado">
                        <label for="barra-energia">Energía</label>
                        <div class="contenedor-barra"><div id="barra-energia" class="barra"></div></div>
                    </div>
                    <div class="estado">
                        <label for="barra-salud">Salud</label>
                        <div class="contenedor-barra"><div id="barra-salud" class="barra"></div></div>
                    </div>
                    <div class="estado">
                        <label for="barra-aburrimiento">Aburrimiento</label>
                        <div class="contenedor-barra"><div id="barra-aburrimiento" class="barra"></div></div>
                    </div>
                </div>
            </div>

            <div class="contenedor-dragon">
                <div id="log-mensajes"></div>
                <video id="tamagotchi-video" width="320" height="240" autoplay loop muted>
                    <source src="" type="video/mp4">
                </video>
            </div>
        </div>

        <div id="contador-tiempo">
            <span id="tiempo-transcurrido" style="display: none;">0</span> 
        </div>

        <div class="botones">
            <button id="alimentar">Alimentar</button>
            <button id="jugar">Jugar</button>
            <button id="dormir">Dormir</button>
            <button id="curar" style="display: none;">Curar</button>
            <button id="pip-button" class="boton-pip">Minimizar</button>
            <button id="reiniciar-Tamagotchi-btn" style="display:none">Reiniciar</button>
        </div>
    </div>  
    <script src="src/web/main.js" type="module"></script>  
</body>
</html>
